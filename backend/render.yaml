services:
  - type: web
    name: jobhunter-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard
      - key: MONGODB_DB_NAME
        value: jobhunter
      - key: GMAIL_USER
        sync: false   # Set this in Render dashboard - your Gmail address
      - key: GMAIL_APP_PASSWORD
        sync: false   # Set this in Render dashboard - 16-char Gmail App Password
